<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExcuusExpert - Doorsturen...</title>
    
    <!-- Directe Meta Refresh Redirect -->
    <meta http-equiv="refresh" content="0; url=https://excuusexpert.github.io/">
    <link rel="canonical" href="https://excuusexpert.github.io/">
    
    <!-- Directe JavaScript Redirect (voor extra snelheid) -->
    <script>
        window.location.replace("https://excuusexpert.github.io/");
    </script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p {
            color: #a1a1aa;
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 24px;
        }
        a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        /* Moderne minimalistische spinner */
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1 style="margin-top: 20px;">Je wordt doorgestuurd</h1>
        <p>Een moment geduld alstublieft...</p>
        <p style="font-size: 0.85rem;">Blijf je hangen? <a href="https://excuusexpert.github.io/">Klik dan hier</a>.</p>
    </div>

</body>
</html>
